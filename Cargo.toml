[workspace]
resolver = "2"
members = ["garbar", "garbarctl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["mfwolffe"]
license = "MIT"
repository = "https://github.com/mfwolffe/garbar"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# X11
x11rb = { version = "0.13", features = ["randr", "xfixes"] }

# Rendering
cairo-rs = { version = "0.20", features = ["xcb"] }
pango = "0.20"
pangocairo = "0.20"

# Configuration
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = "0.4"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
dirs = "5"
libc = "0.2"
async-trait = "0.1"

# Audio (optional)
libpulse-binding = "2"
